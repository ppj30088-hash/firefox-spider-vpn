# Builds spider firefox vpn for Windows, macOS, Android (one universal APK
# plus one per architecture) and Linux, and publishes them as a GitHub
# release (Releases, on the repository's page) by itself:
#
# - A push to main publishes when the version in app/pubspec.yaml has no
#   release yet: raise the version (version: 1.0.1+2; the number after the
#   plus must grow for Android to install it over the old one), push, and
#   the release "v1.0.1" appears when the builds are done.
# - "Run workflow" (Actions tab) builds and publishes the current version,
#   replacing the files of its release if there is one.
# - A tag "v<version>" does the same.
#
# The tests report, and do not hold a release back.
#
# Each file is published twice: under a fixed name (which the README's
# releases/latest/download links fetch) and with the version in its name
# (Spider-Firefox-VPN-1.2.3-Android-universal.apk).
#
# Secrets (Settings, Secrets and variables, Actions), all optional:
#   ANDROID_KEYSTORE_BASE64    the Android key (.jks), base64-encoded
#   ANDROID_KEYSTORE_PASSWORD  its password
# Without a valid key the APKs are signed with a debug key.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
    # A change to the documentation alone (READMEs, docs/, screenshots)
    # runs nothing; GitHub does not apply this filter to tags, so a release
    # always builds.
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  FLUTTER_VERSION: 3.47.7
  GOMOBILE_VERSION: v0.0.0-20260908204917-8b95e45f8d3e

jobs:
  test:
    runs-on: ubuntu-24.04
    # A failing test shows red here and does not stop the builds or the
    # release.
    continue-on-error: true
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.release.outputs.release }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        name: Version
        run: |
          v="$(sed -n 's/^version:[[:space:]]*\([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p' app/pubspec.yaml)"
          echo "version=$v" >> "$GITHUB_OUTPUT"
      # Whether this run builds and publishes: a tag, "Run workflow", or a
      # push to main whose version has no release yet.
      - id: release
        name: Release or not
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ steps.version.outputs.version }}"
          tag="v$v"
          release=false
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
            release=true
          elif [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            release=true
          elif [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]]; then
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "release $tag exists: only tests run (raise the version in app/pubspec.yaml for a new one)"
            else
              release=true
            fi
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release=$release tag=$tag"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$v" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match app/pubspec.yaml ($v)"
            exit 1
          fi
      # The apps read .github/updates.json from the default branch as soon
      # as it is pushed (app/lib/app_info.dart): the version each system's
      # app offers.
      - name: Update notice
        run: |
          jq -e 'type == "object"
            and all(keys[]; IN("android", "linux", "macos", "windows"))
            and all(.[]; type == "string" and test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))' .github/updates.json >/dev/null || {
            echo "::error::updates.json must be an object whose keys are android, linux, macos, or windows, each with a \"major.minor.patch\" version"
            exit 1
          }
          # A version that is never released would stop that system's
          # updates without a word.
          v="${{ steps.version.outputs.version }}"
          ahead="$(jq -r --arg v "$v" '($v | split(".") | map(tonumber)) as $app
            | to_entries[] | select((.value | split(".") | map(tonumber)) > $app) | "\(.key) \(.value)"' .github/updates.json | xargs)"
          if [ -n "$ahead" ]; then
            echo "::error::updates.json names versions newer than app/pubspec.yaml ($v): $ahead"
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            v="${GITHUB_REF_NAME#v}"
            systems="$(jq -r --arg v "$v" 'to_entries[] | select(.value == $v) | .key' .github/updates.json | xargs)"
            if [ -z "$systems" ]; then
              echo "::warning::updates.json gives $v to no system: the apps that read it do not offer this release"
            else
              echo "updates.json offers $v to: $systems"
            fi
          fi
      - uses: actions/setup-go@v7
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - name: Core
        working-directory: core
        run: |
          go vet ./...
          go test ./...
          # The TUN stack's tests need sing-tun's gVisor stack.
          go vet -tags with_gvisor ./internal/tunstack/
          go test -tags with_gvisor ./internal/tunstack/
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: App
        working-directory: app
        run: |
          flutter pub get
          flutter analyze
          # The tests exercise the update check, which a build without an
          # update source (the default) leaves off.
          flutter test --dart-define=GITHUB_REPO=owner/repo

  windows:
    needs: test
    # Built unless the repository variable PLATFORMS (Settings, Secrets and
    # variables, Actions, Variables) is set and leaves it out, e.g. "linux".
    if: needs.test.outputs.release == 'true' && (vars.PLATFORMS == '' || contains(vars.PLATFORMS, 'windows'))
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Inno Setup
        run: choco upgrade innosetup -y --no-progress
      - name: Build
        shell: pwsh
        env:
          # The key updates are signed with (scripts/signing-key.ps1): the
          # core and the TUN service take only updates it signed; without
          # it they take none.
          FIREFOX_VPN_SIGNING_KEY: ${{ secrets.FIREFOX_VPN_SIGNING_KEY }}
        run: ./scripts/build-windows.ps1
      - name: Release names
        shell: pwsh
        run: |
          $v = '${{ needs.test.outputs.version }}'
          New-Item -ItemType Directory out | Out-Null
          Move-Item "dist/Firefox-VPN-$v-Windows-x64.zip" out/Firefox-VPN-Windows-x64.zip
          Move-Item "dist/Firefox-VPN-$v-Windows-Setup-x64.exe" out/Firefox-VPN-Windows-Setup-x64.exe
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: out/*
          if-no-files-found: error

  android:
    needs: test
    if: needs.test.outputs.release == 'true' && (vars.PLATFORMS == '' || contains(vars.PLATFORMS, 'android'))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: NDK and gomobile
        run: |
          ndk="$(sed -n 's/.*ndkVersion = "\(.*\)".*/\1/p' app/android/app/build.gradle.kts)"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$ndk" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ndk" >> "$GITHUB_ENV"
          go install "golang.org/x/mobile/cmd/gomobile@$GOMOBILE_VERSION" "golang.org/x/mobile/cmd/gobind@$GOMOBILE_VERSION"
      - name: Release key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::warning::no release key: the APKs are signed with a debug key"
            exit 0
          fi
          printf '%s' "$KEYSTORE" | tr -d ' \r\n' | base64 -d > app/android/release.jks
          # Checked here, so a bad copy of the key is a warning (and debug
          # signing), not a failed build.
          if keytool -list -keystore app/android/release.jks -storepass "$PASSWORD" -alias release > /tmp/keytool.txt 2>&1; then
            printf 'storeFile=../release.jks\nstorePassword=%s\nkeyAlias=release\nkeyPassword=%s\n' "$PASSWORD" "$PASSWORD" > app/android/key.properties
            echo "release key OK"
          else
            echo "::warning::the release key could not be read, so the APKs are signed with a debug key. keytool said:"
            sed 's/^/    /' /tmp/keytool.txt
            rm -f app/android/release.jks
          fi
      - name: Build
        run: |
          v='${{ needs.test.outputs.version }}'
          mkdir -p app/android/app/libs
          (cd core && gomobile bind -target=android -androidapi 24 -trimpath \
            -ldflags "-s -w -X github.com/armanlife/firefox-vpn-client/core/internal/version.Current=$v" \
            -o ../app/android/app/libs/core.aar ./mobile)
          cd app
          flutter pub get
          mkdir -p ../out
          flutter build apk --release --split-per-abi --dart-define=APP_VERSION=$v
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "build/app/outputs/flutter-apk/app-$abi-release.apk" "../out/Firefox-VPN-Android-$abi.apk"
          done
          flutter build apk --release --dart-define=APP_VERSION=$v
          cp build/app/outputs/flutter-apk/app-release.apk ../out/Firefox-VPN-Android-universal.apk
      - name: Remove the key
        if: always()
        run: rm -f app/android/release.jks app/android/key.properties
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: out/*
          if-no-files-found: error

  linux:
    needs: test
    if: needs.test.outputs.release == 'true' && (vars.PLATFORMS == '' || contains(vars.PLATFORMS, 'linux'))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - name: Build
        run: bash scripts/build-linux-core.sh
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: dist/firefox-vpn-core-linux-*.tar.gz
          if-no-files-found: error

  linux-desktop:
    needs: test
    if: needs.test.outputs.release == 'true' && (vars.PLATFORMS == '' || contains(vars.PLATFORMS, 'linux'))
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    # The oldest supported runners: the app runs where their glibc and GTK do.
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - uses: subosito/flutter-action@v2
        if: matrix.arch == 'amd64'
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # Flutter publishes SDK archives for x64 Linux only; on ARM it runs
      # from its Git tag and fetches its ARM engine itself.
      - name: Flutter (ARM)
        if: matrix.arch == 'arm64'
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
          "$HOME/flutter/bin/flutter" --version
      - name: Build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang cmake ninja-build pkg-config libgtk-3-dev
      # A real TUN, as root, for a minute (internal/tunservice/e2e_test.go):
      # this computer is CI's.
      - name: TUN end to end
        continue-on-error: true
        working-directory: core
        run: |
          go test -c -tags 'e2e with_gvisor' -o "$RUNNER_TEMP/e2e.test" ./internal/tunservice
          sudo "$RUNNER_TEMP/e2e.test" -test.run TestEndToEnd -test.v
      # The service installed with systemd for this user, who then removes
      # it through the service, without a prompt.
      - name: TUN service with systemd
        continue-on-error: true
        working-directory: core
        run: |
          go build -tags with_gvisor -o "$RUNNER_TEMP/firefox-vpn-tun" ./cmd/firefox-vpn-tun
          sudo "$RUNNER_TEMP/firefox-vpn-tun" install
          systemctl is-active firefox-vpn-tun
          "$RUNNER_TEMP/firefox-vpn-tun" uninstall
          for i in $(seq 20); do systemctl is-active --quiet firefox-vpn-tun || break; sleep 0.5; done
          if systemctl is-active --quiet firefox-vpn-tun; then echo "the service still runs"; exit 1; fi
          test ! -e /etc/systemd/system/firefox-vpn-tun.service
          test ! -e /opt/firefox-vpn-tun
      - name: Build
        env:
          # The key updates are signed with: the core and the TUN service
          # take only updates it signed; without it they take none.
          FIREFOX_VPN_SIGNING_KEY: ${{ secrets.FIREFOX_VPN_SIGNING_KEY }}
        run: bash scripts/build-linux.sh
      - name: Release name
        run: |
          mkdir out
          mv "dist/Firefox-VPN-${{ needs.test.outputs.version }}-Linux-${{ matrix.arch }}.tar.gz" "out/Firefox-VPN-Linux-${{ matrix.arch }}.tar.gz"
      - uses: actions/upload-artifact@v7
        with:
          name: linux-desktop-${{ matrix.arch }}
          path: out/*
          if-no-files-found: error

  macos:
    needs: test
    if: needs.test.outputs.release == 'true' && (vars.PLATFORMS == '' || contains(vars.PLATFORMS, 'macos'))
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # What runs only on macOS: the system proxy, the TUN service and its
      # socket, DNS settings, the core's binding outside the TUN, and the
      # app's update.
      - name: Core tests on macOS
        continue-on-error: true
        working-directory: core
        run: |
          go vet ./...
          go test -skip "$MAC_UPDATE_TESTS" ./internal/desktop ./internal/config ./internal/egress ./internal/netstate ./internal/tunapi ./internal/tunservice ./internal/update
          go test -tags with_gvisor ./internal/tunstack/
        env:
          MAC_UPDATE_TESTS: TestTheAppOpensWithItsArguments|TestTheBundleLosesTheQuarantineMark
      # The update's Launch Services and quarantine tests. Not yet run on a
      # Mac but here, so a failure shows without holding the release back.
      - name: Update tests that need a Mac
        continue-on-error: true
        working-directory: core
        run: go test -v -run 'TestTheAppOpensWithItsArguments|TestTheBundleLosesTheQuarantineMark' ./internal/update
      # A real TUN, as root, for a minute (internal/tunservice/e2e_test.go):
      # this computer is CI's. Not yet run on a Mac but here, so a failure
      # shows without holding the release back.
      - name: TUN end to end
        continue-on-error: true
        working-directory: core
        run: |
          go test -c -tags 'e2e with_gvisor' -o "$RUNNER_TEMP/e2e.test" ./internal/tunservice
          sudo "$RUNNER_TEMP/e2e.test" -test.run TestEndToEnd -test.v
      # The service installed with launchd for this user, who then removes
      # it through the service, without a prompt.
      - name: TUN service with launchd
        continue-on-error: true
        working-directory: core
        run: |
          go build -tags with_gvisor -o "$RUNNER_TEMP/firefox-vpn-tun" ./cmd/firefox-vpn-tun
          sudo "$RUNNER_TEMP/firefox-vpn-tun" install
          sudo launchctl print system/com.arman.firefoxvpn.tun | head -20
          "$RUNNER_TEMP/firefox-vpn-tun" uninstall
          for i in $(seq 20); do sudo launchctl print system/com.arman.firefoxvpn.tun >/dev/null 2>&1 || break; sleep 0.5; done
          if sudo launchctl print system/com.arman.firefoxvpn.tun >/dev/null 2>&1; then echo "the job is still loaded"; exit 1; fi
          test ! -e /Library/LaunchDaemons/com.arman.firefoxvpn.tun.plist
          test ! -e "/Library/Application Support/Firefox VPN TUN"
      - name: Build
        env:
          # The key updates are signed with: the core and the TUN service
          # take only updates it signed; without it they take none.
          FIREFOX_VPN_SIGNING_KEY: ${{ secrets.FIREFOX_VPN_SIGNING_KEY }}
        run: bash scripts/build-macos.sh
      # The app's own update, end to end: the app just built, in
      # /Applications, updates itself to a test release on loopback
      # (scripts/test-update-macos.sh). Not yet run on a Mac but here, so a
      # failure shows without holding the release back.
      - name: App update end to end
        continue-on-error: true
        # Its own waits end within about 10 minutes; a dialog nobody answers
        # must not hold the release for the job's 6 hours.
        timeout-minutes: 20
        run: bash scripts/test-update-macos.sh "$RUNNER_TEMP/update-test"
      # Its screenshots and logs; not on a release, which takes every
      # artifact of the run.
      - uses: actions/upload-artifact@v7
        if: always() && !startsWith(github.ref, 'refs/tags/v')
        with:
          name: macos-update-test
          path: ${{ runner.temp }}/update-test
          if-no-files-found: ignore
      - name: Release name
        run: |
          mkdir out
          mv "dist/Firefox-VPN-${{ needs.test.outputs.version }}-macOS.dmg" out/Firefox-VPN-macOS.dmg
          mv "dist/Firefox-VPN-${{ needs.test.outputs.version }}-macOS.tar.gz" out/Firefox-VPN-macOS.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: out/*
          if-no-files-found: error

  release:
    needs: [test, windows, android, linux, linux-desktop, macos]
    # A platform left out by PLATFORMS is skipped, not failed: the release
    # goes on with the rest.
    if: needs.test.outputs.release == 'true' && !failure() && !cancelled()
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true
      # The programs' names, spider's: Spider-Firefox-VPN-Windows-x64.zip,
      # and a copy of each file with the version after it.
      - name: Names
        working-directory: release
        run: |
          v="${{ needs.test.outputs.version }}"
          for f in Firefox-VPN-*; do
            [ -e "$f" ] && mv "$f" "Spider-$f"
          done
          for f in Spider-Firefox-VPN-*; do
            cp "$f" "Spider-Firefox-VPN-$v-${f#Spider-Firefox-VPN-}"
          done
          for f in firefox-vpn-core-*; do
            [ -e "$f" ] && cp "$f" "firefox-vpn-core-$v-${f#firefox-vpn-core-}"
          done
          ls
      - name: Checksums
        working-directory: release
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      # The desktop apps install a new version only when the update key
      # signed this list (core/internal/update); without the key (the
      # secret FIREFOX_VPN_SIGNING_KEY) they do not update by themselves.
      - name: Sign the checksums
        working-directory: core
        env:
          FIREFOX_VPN_SIGNING_KEY: ${{ secrets.FIREFOX_VPN_SIGNING_KEY }}
        run: |
          if [ -z "$FIREFOX_VPN_SIGNING_KEY" ]; then
            echo "::warning::no update key (the secret FIREFOX_VPN_SIGNING_KEY): the desktop apps will not update themselves from this release"
            exit 0
          fi
          go run ./tools/sign ../release/SHA256SUMS.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ needs.test.outputs.tag }}"
          v="${{ needs.test.outputs.version }}"
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$tag"
          {
            echo "## spider firefox vpn $v"
            echo
            echo "| System | File |"
            echo "|---|---|"
            echo "| Android (all phones) | [Spider-Firefox-VPN-Android-universal.apk]($base/Spider-Firefox-VPN-$v-Android-universal.apk) |"
            echo "| Windows | [Setup]($base/Spider-Firefox-VPN-$v-Windows-Setup-x64.exe) · [portable zip]($base/Spider-Firefox-VPN-$v-Windows-x64.zip) |"
            echo "| macOS | [dmg]($base/Spider-Firefox-VPN-$v-macOS.dmg) |"
            echo "| Linux | [x64]($base/Spider-Firefox-VPN-$v-Linux-amd64.tar.gz) · [arm64]($base/Spider-Firefox-VPN-$v-Linux-arm64.tar.gz) |"
            echo
            echo "All files and their SHA-256 sums are in the list below."
          } > notes.md
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" release/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" release/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "spider firefox vpn $v" \
              --notes-file notes.md
          fi
